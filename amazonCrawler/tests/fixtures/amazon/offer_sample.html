<!DOCTYPE html>
<!-- 最小化 offer 列表页 fixture：结构基于 Amazon 公开 offer 列表页常见标记
     （#olpOfferList / .olpOffer / .olpPriceColumn / .olpSellerColumn /
     "Ships from Amazon" / "Sold by Amazon"），非真实抓取样本，待实测校准。 -->
<html lang="en-us"><body>
<div id="olpOfferList" class="a-section a-spacing-none">
  <ol class="olpOfferList a-section a-spacing-none a-spacing-top-medium">

    <li class="olpOffer">
      <div class="a-column a-span2 olpPriceColumn"><span class="a-price"><span class="a-offscreen">$14.99</span></span></div>
      <div class="a-column a-span8 olpSellerColumn">
        <p class="a-spacing-mini">
          <a class="a-link-normal" href="/gp/help/seller/at-a-glance.html?seller=A21T9VMSLBQ6TP">Just Customized</a>
        </p>
        <ul class="a-unordered-list a-vertical a-spacing-none"><li><span>Ships from Amazon</span></li></ul>
      </div>
    </li>

    <li class="olpOffer">
      <div class="a-column a-span2 olpPriceColumn"><span class="a-price"><span class="a-offscreen">$15.49</span></span></div>
      <div class="a-column a-span8 olpSellerColumn">
        <p class="a-spacing-mini">
          <a class="a-link-normal" href="/gp/help/seller/at-a-glance.html?seller=A358NHPDS1ZMEA">EmbrolyStore</a>
        </p>
      </div>
    </li>

    <li class="olpOffer">
      <div class="a-column a-span2 olpPriceColumn"><span class="a-price"><span class="a-offscreen">$16.99</span></span></div>
      <div class="a-column a-span8 olpSellerColumn">
        <span class="a-size-medium a-color-success">Amazon.com</span>
        <ul class="a-unordered-list a-vertical a-spacing-none"><li><span>Sold by Amazon.com</span></li></ul>
      </div>
    </li>

  </ol>
</div>
</body></html>
