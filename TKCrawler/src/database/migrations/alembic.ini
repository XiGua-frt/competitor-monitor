# Alembic 配置 — 供 scripts/init_db.py 程序化调用:
#   alembic -c src/database/migrations/alembic.ini upgrade head
[alembic]
# 迁移脚本目录 = 本 ini 文件所在目录
script_location = %(here)s

# 运行时由 scripts/init_db.py 覆盖为 src/common/config.py 中的
# DATABASE_URL (POSTGRES_* 变量), 此处留空仅作占位。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
